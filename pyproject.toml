[project]
name = "hsa"
version = "0.1.0"
description = "Hiking Safety Assistant, hackathon slice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "httpx>=0.27",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyyaml>=6.0",
  "anthropic>=0.40",
]
[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "pytest-timeout>=2.3"]
grib = ["cfgrib>=0.9.14", "eccodes>=2.37", "xarray>=2024.6", "numpy>=1.26"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real external services; skipped unless LIVE=1"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py312"
