[project]
name = "hiking-safety-assistant-api"
version = "0.1.0"
description = "Backend for the hiking safety assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.2",
    # Phase 1, routing. All three are plain wheels: no GDAL, no system packages.
    "networkx>=3.4",
    "pyproj>=3.7",
    "shapely>=2.1",
    # Phase 5, the MCP server. 2.x: FastMCP is `MCPServer` there, and the imports differ from 1.x.
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    # The async tests need its pytest plugin; it arrived transitively before it was asked for.
    "anyio>=4.8",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
# Phase 2, the official ICON GRIB2 source. Optional: `uv sync --group grib`. `eccodes` is only the
# Python binding; on Linux `eccodeslib` supplies the C library as a wheel, on macOS (no such wheel)
# it needs `brew install eccodes`. Without the group, WEATHER_SOURCE=open-meteo serves the same
# model with nothing to install.
grib = [
    "eccodes>=2.41",
    "eccodeslib>=2.41; sys_platform == 'linux'",
    "numpy>=2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
