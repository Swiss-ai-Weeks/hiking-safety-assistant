[project]
name = "hiking-safety-assistant-api"
version = "0.1.0"
description = "Backend for the hiking safety assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
